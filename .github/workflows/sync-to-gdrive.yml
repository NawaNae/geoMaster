name: Sync to Google Drive

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Pull from Google Drive"]
    types: [completed]
  workflow_dispatch:

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 檢出完整 Git 歷史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 壓縮 .git 內部碎片檔案 (提升 Google Drive 同步速度)
        run: |
          git gc --prune=now

      - name: 打包乾淨原始碼快照 ZIP (不含 .git)
        run: |
          NAME="geoMaster-latest"
          git archive --format=zip -o "${NAME}.zip" HEAD

      - name: 安裝 rclone
        run: sudo apt-get install -y rclone

      - name: 配置 Google Drive 連線 (OAuth 2.0)
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # 檢查必要的 Secrets 是否存在，並透過 Python 寫入 rclone 設定
          python3 - << 'PYEOF'
          import os, sys

          token = os.environ.get('GDRIVE_TOKEN', '').strip()
          folder_id = os.environ.get('GDRIVE_FOLDER_ID', '').strip()
          client_id = os.environ.get('GDRIVE_CLIENT_ID', '').strip()
          client_secret = os.environ.get('GDRIVE_CLIENT_SECRET', '').strip()

          missing = []
          if not token: missing.append("GDRIVE_TOKEN")
          if not client_id: missing.append("GDRIVE_CLIENT_ID")
          if not client_secret: missing.append("GDRIVE_CLIENT_SECRET")
          if not folder_id: missing.append("GDRIVE_FOLDER_ID")

          if missing:
              print(f"❌ 錯誤：GitHub Repository Secrets 缺少以下變數: {', '.join(missing)}", file=sys.stderr)
              print("👉 請前往 Repo -> Settings -> Secrets and variables -> Actions 確認是否有新增！", file=sys.stderr)
              sys.exit(1)

          conf_dir = os.path.expanduser('~/.config/rclone')
          os.makedirs(conf_dir, exist_ok=True)

          lines = [
              "[gdrive]",
              "type = drive",
              f"client_id = {client_id}",
              f"client_secret = {client_secret}",
              "scope = drive",
              f"token = {token}",
              f"root_folder_id = {folder_id}",
              ""
          ]

          with open(os.path.join(conf_dir, 'rclone.conf'), 'w', encoding='utf-8') as f:
              f.write("\n".join(lines))
          print("✅ rclone 連線配置成功建立！")
          PYEOF

      - name: 增量同步檔案到 Google Drive
        run: |
          # rclone sync 會增量比對，只更新有變動的檔案（diff）
          # 包含完整 .git 歷史與最新版 ZIP 快照，排除 .github workflow 本身
          rclone sync . gdrive: \
            --fast-list \
            --drive-use-trash=false \
            --exclude ".github/**" \
            -v

      - name: 清理設定檔
        if: always()
        run: rm -rf ~/.config/rclone
